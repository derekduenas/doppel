# ---- stays on Apex only (never uploaded) -----------------------------------------------------
[do_only]
paths = [
  "/opt/doppel", "/opt/doppel.old", "/opt/doppel-bin", "/opt/doppel-rust", "/opt/doppel-testenv",   # releases/venvs: rebuilt from git
  "/var/tmp",                                                                                         # scratch, CI checkouts, exam outputs (results go to git/evidence)
  "/srv/git/doppel.git",
  "/mnt/volume_nyc1_1793485122853/doppel/perelman-relay",                                             # copy of PERELMAN's stream; PERELMAN keeps the original                                                                              # mirror of GitHub
]
skip_names = ["status.json", "janitor.log", "janitor-protect.txt", "*.lock", "*.tmp", "*.partial"]

[never]
paths = ["/etc/doppel", "/etc/credstore", "/etc/credstore.encrypted", "/etc/edge-engine"]

# ---- the volume's top level must be fully classified ------------------------------------------
[audit]
classified_roots = ["/mnt/volume_nyc1_1793485122853/doppel"]
grace = "3h"              # an eligible file missing from R2 for longer than this is an error
