# DOPPEL storage policy: where every kind of data lives.
# Read by ops/storage.py (copy, audit, verify). The janitor uses a size-audit
# shortlist and checks the native seal and exact remote bytes before any prune.
#
# Homes:
#   do    = Apex (DigitalOcean droplet + volume): hot working copy, releases, scratch, secrets
#   r2    = Cloudflare R2 bucket `doppel-tape`: permanent copy of everything that cannot be regenerated
#   git   = GitHub + Apex mirror: code, registry, docs, evidence/prereg (never data blobs, never secrets)
#   never = must not leave Apex (credentials, logs that may hold hostnames/keys)

[r2]
remote = "r2:doppel-tape"
rclone = "/usr/local/bin/rclone-r2"   # apt rclone 1.60 fails against R2 (NotImplemented)
config = "/etc/doppel/rclone.conf"
bwlimit = "25M"

# ---- copied to R2 (and kept on Apex for local_days) -------------------------------------------
[[class]]
name = "tape"
why = "Python recorder of record: hourly sealed segments + receipts; cannot be re-recorded"
local = "/mnt/volume_nyc1_1793485122853/doppel/tape"
r2 = "apex/tape"
include = ["**/*.dtape.zst"]
uploader = "archive_tape"
min_age = "2h"            # never upload an hour still being written
local_days = 14           # janitor target once R2 is verified; protected days kept regardless

[[class]]
name = "tape-index"
why = "per-stream manifests (segment hashes), receipts, import watermarks: appended hourly, so copied every run"
local = "/mnt/volume_nyc1_1793485122853/doppel/tape"
r2 = "apex/tape"
include = ["**/manifest.jsonl", "receipts/**", "**/import-watermark.json"]
min_age = "0s"
local_days = 0

[[class]]
name = "tape-goldsky-activity"
why = "Goldsky activity exports stored beside the recorder streams"
local = "/mnt/volume_nyc1_1793485122853/doppel/tape"
r2 = "apex/tape"
include = ["goldsky_activity/*.jsonl"]
min_age = "2h"
local_days = 0

[[class]]
name = "tape-rust"
why = "Rust shadow recorder segments"
