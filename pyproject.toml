[project]
name = "doppel"
version = "0.1.0"
description = "DOPPEL: Polymarket intl intelligence -> US-venue market making (research + tape)"
requires-python = ">=3.11"
dependencies = [
  "websockets>=13,<16",
  "aiohttp>=3.9,<4",
  "orjson>=3.9",
  "zstandard>=0.22",
  "certifi>=2024.2.2",
  "numpy>=2.4.6",
  "pyarrow>=17",
  "duckdb>=1.1",
  "cryptography>=42",
  "scikit-learn>=1.9.1",
]

[project.scripts]
doppel-tape = "doppel.tape.cli:main"
doppel-goldsky = "doppel.lab.goldsky:main"
doppel-completeness = "doppel.lab.completeness:main"
doppel-scan = "doppel.lab.scan:main"
doppel-ledger = "doppel.lab.ledger:main"
doppel-census = "doppel.lab.census:main"
doppel-refprice = "doppel.lab.refprice:main"
doppel-fair = "doppel.lab.fair:main"
doppel-brti-import = "doppel.lab.brti_import:main"
doppel-vsmarket = "doppel.lab.vsmarket:main"
doppel-anticipation = "doppel.lab.anticipation:main"
doppel-dossier = "doppel.lab.dossier:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doppel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
