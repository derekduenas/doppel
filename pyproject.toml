[project]
name = "doppel"
version = "0.1.0"
description = "DOPPEL: Polymarket intl intelligence -> US-venue market making (research + tape)"
requires-python = ">=3.11"
dependencies = [
  "websockets>=13,<16",
  "aiohttp>=3.9,<4",
  "orjson>=3.9",
  "zstandard>=0.22",
  "certifi>=2024.2.2",
]

[project.scripts]
doppel-tape = "doppel.tape.cli:main"
doppel-goldsky = "doppel.lab.goldsky:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doppel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
